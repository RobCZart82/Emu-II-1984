name: Core build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build --config ${{ matrix.config }} --parallel 3
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
